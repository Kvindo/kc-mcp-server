name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily resource-type drift check against the dev API — see the "drift-check" job below.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  build-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  drift-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Check for resource-type drift against dev
        id: drift
        run: |
          if npm run drift-check; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: File or update a tracking issue on drift
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Resource-type drift detected against dev API"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          BODY="The daily drift-check workflow found resource types in the dev API's swagger.json that \
          aren't reflected in the checked-in \`src/resource-types.generated.ts\`. Run \`npm run generate\` \
          locally, review the diff, and cut a release.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "drift"
          fi
