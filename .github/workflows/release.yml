name: Publish to npm

# Publishes to npm on every vX.Y.Z tag using npm Trusted Publishing (OIDC) — no token, no
# secret. Configured once on npmjs.com (package Settings → Trusted Publisher → GitHub Actions →
# Kvindo/kc-mcp-server → release.yml → Allow npm publish). Mirrors the kc-sdk-python repo's PyPI
# Trusted Publishing workflow. Requires a recent npm CLI (11.5.1+) for OIDC support, hence the
# explicit upgrade step below — the npm version bundled with actions/setup-node's Node 20 is
# older than that.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC Trusted Publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
