name: Publish to npm

# Publishes to npm on every vX.Y.Z tag using npm Trusted Publishing (OIDC) — no token, no
# secret. Configured once on npmjs.com (package Settings → Trusted Publisher → GitHub Actions →
# Kvindo/kc-mcp-server → release.yml → Allow npm publish). Mirrors the kc-sdk-python repo's PyPI
# Trusted Publishing workflow. Requires a recent npm CLI (11.5.1+) for OIDC support — Node 22
# ships one, unlike Node 20's bundled npm 10.8.2 (and `npm install -g npm@latest` on Node 20
# fails outright: current npm requires Node >=22). The rest of the repo still targets Node >=18
# (package.json engines) — this pin is release-workflow-only.
#
# Deliberately no `registry-url` on setup-node: that input unconditionally writes a
# `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line to .npmrc even when NODE_AUTH_TOKEN
# is unset, which took precedence over OIDC and broke the publish (signed provenance succeeded,
# then the actual PUT 404'd on an empty legacy token). Trusted Publishing only kicks in cleanly
# with no legacy auth configured at all.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC Trusted Publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
